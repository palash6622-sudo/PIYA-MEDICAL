<h2>PIYA MEDICAL - Order Page</h2>

<form method="POST" action="/order">
  Name: <input type="text" name="name"><br><br>

  Product:
  <select name="product_id">
    {% for p in products %}
    <option value="{{p[0]}}">{{p[1]}}</option>
    {% endfor %}
  </select>

  <br><br>
  <button type="submit">Order Now</button>
</form>
